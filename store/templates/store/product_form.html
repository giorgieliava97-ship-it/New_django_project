{% extends 'base.html' %}

{% block title %}{{ action }} Product{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8">
            <div class="card shadow-lg border-0 rounded-4 p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <h2 class="text-primary fw-bold">{{ action }} Product</h2>
                    <p class="text-muted">Please fill in the product details below</p>
                </div>

                <form method="POST" enctype="multipart/form-data" class="needs-validation">
                    {% csrf_token %}

                    <!-- ფორმის ველები -->
                    <div class="mb-3">
                        {{ form.as_p }}
                    </div>

                    <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                        <a href="{% url 'store:product_list' %}" class="btn btn-outline-secondary px-4 rounded-pill">
                            <i class="fas fa-arrow-left me-2"></i> Return
                        </a>
                        <button type="submit" class="btn btn-primary px-5 rounded-pill shadow-sm">
                            <i class="fas fa-save me-2"></i> Save
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
