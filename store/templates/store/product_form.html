{% extends 'base.html' %}

{% block title %}Product {{ action }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow p-4">
            <h2 class="mb-4 text-center">Product {{ action }}</h2>
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-3">Save</button>
            </form>
            <a href="{% url 'store:product_list' %}" class="btn btn-secondary w-100 mt-2">Return</a>
        </div>
    </div>
</div>
{% endblock %}
