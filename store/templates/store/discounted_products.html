{% extends 'base.html' %}

{% block title %}Discounted Products{% endblock %}

{% block content %}
<div class="container py-5">
    <h1 class="text-danger mb-4">🔥 Discounted Products</h1>
    <a href="{% url 'store:product_list' %}" class="btn btn-outline-secondary mb-4">← Back to main page</a>
    <hr>

    <div class="row g-4">
        {% for product in products %}
            <div class="col-md-6 col-lg-4">
                <div class="border rounded p-4 shadow-sm bg-white">
                    <h3>
                        <a href="{% url 'store:product_detail' product.pk %}" class="text-decoration-none">
                            {{ product.name }}
                        </a>
                    </h3>
                    <p class="fs-5 text-danger mb-2">{{ product.price }} ₾</p>
                    <span class="badge bg-danger">SALE</span>
                </div>
            </div>
        {% empty %}
            <div class="col-12">
                <p class="text-muted">There are no discounted products.</p>
            </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
