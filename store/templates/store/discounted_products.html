<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Discounted Products</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .sale-badge { background-color: red; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body>
    <h1 style="color: red;">🔥 Discounted Products</h1>
    <a href="{% url 'store:product_list' %}">← Back to main page</a>
    <hr>

    <ul>
        {% for product in products %}
            <li>
                <a href="{% url 'store:product_detail' product.pk %}">
                    <strong>{{ product.name }}</strong>
                </a>
                - {{ product.price }} ₾
                <span class="sale-badge">SALE</span>
            </li>
        {% empty %}
            <p>There are no discounted products.</p>
        {% endfor %}
    </ul>
</body>
</html>
