{% extends 'base.html' %}

{% block title %}Delete Product{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center">
        <div class="card shadow p-4">
            <h3 class="mb-3 text-danger">Are you sure you want to delete product? "{{ product.name }}"?</h3>
            <form method="POST">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4">Yes, delete!</button>
                <a href="{% url 'store:product_detail' product.pk %}" class="btn btn-secondary px-4">cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
