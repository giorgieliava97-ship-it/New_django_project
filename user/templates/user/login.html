{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Authorisation</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mb-3">
            <a href="{% url 'user:password_reset' %}" class="text-decoration-none text-muted small">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-success">Log in</button>
    </form>
</div>
{% endblock %}
