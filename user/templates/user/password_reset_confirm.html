{% extends 'base.html' %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 border rounded p-4 bg-white shadow-sm">
            <h2 class="mb-3">Enter New Password</h2>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="password" class="form-label">New Password</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="confirm_password" class="form-label">Confirm Password</label>
                    <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Re-enter new password" required>
                </div>
                <button type="submit" class="btn btn-success w-100 rounded-pill py-2">Change Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
