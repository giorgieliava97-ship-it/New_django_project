{% extends 'base.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 border rounded p-4 bg-white shadow-sm">
            <h2 class="mb-3">Forgot Your Password?</h2>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" name="username" id="username" class="form-control" placeholder="Enter your username" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email address</label>
                    <input type="email" name="email" id="email" class="form-control" placeholder="Enter your email" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2">Send Reset Link</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{% url 'user:login' %}" class="text-decoration-none text-muted">Back to Login</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
